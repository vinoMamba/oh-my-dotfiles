# Font
font_family      Maple Mono
italic_font      Maple Mono
font_size        15.0
adjust_cell_height 1

# Cursor
cursor_shape underline
cursor_blink_interval 0

# Window
remember_window_size  yes
window_width  300c
window_height 90c
window_padding_width 10
window_padding_height 2
hide_window_decorations titlebar-only
scrollbar_width 0

# Gruvbox Dark Hard colors
foreground              #ebdbb2
background              #1d2021
selection_foreground    #1d2021
selection_background    #ebdbb2
cursor                  #ebdbb2
cursor_text_color       #1d2021

# Black
color0 #1d2021
color8 #665c54
# Red
color1 #cc241d
color9 #fb4934
# Green
color2  #98971a
color10 #b8bb26
# Yellow
color3  #d79921
color11 #fabd2f
# Blue
color4  #458588
color12 #83a598
# Magenta
color5  #b16286
color13 #d3869b
# Cyan
color6  #689d7a
color14 #8ec07c
# White
color7  #a89984
color15 #ebdbb2

# Background
background_opacity 1.0

# Shell
shell /opt/homebrew/bin/tmux new-session -A -s main
shell_integration enabled

# Bell
enable_audio_bell no

# Keybindings with Ctrl+a as prefix (like tmux)
# Split navigation (hjkl style)
# map ctrl+a>h neighboring_window left
# map ctrl+a>j neighboring_window down
# map ctrl+a>k neighboring_window up
# map ctrl+a>l neighboring_window right

# Split creation
# map ctrl+a>minus launch --location=vsplit --cwd=current
# map ctrl+a>shift+minus launch --location=hsplit --cwd=current

# New tab/window
# map ctrl+a>c new_tab
# map ctrl+a>n new_os_window

# Tab navigation
# map ctrl+a>p previous_tab
# map ctrl+a>shift+p next_tab
# map ctrl+a>1 goto_tab 1
# map ctrl+a>2 goto_tab 2
# map ctrl+a>3 goto_tab 3
# map ctrl+a>4 goto_tab 4
# map ctrl+a>5 goto_tab 5
# map ctrl+a>6 goto_tab 6
# map ctrl+a>7 goto_tab 7
# map ctrl+a>8 goto_tab 8
# map ctrl+a>9 goto_tab 9

# Close
# map ctrl+a>x close_window
# map ctrl+a>shift+x close_os_window

# Split resizing
# map ctrl+a>shift+h resize_window narrower 50
# map ctrl+a>shift+j resize_window taller  50
# map ctrl+a>shift+k resize_window shorter 50
# map ctrl+a>shift+l resize_window wider    50

# Zoom
# map ctrl+a>z toggle_layout stack

# Send Ctrl+a
# map ctrl+a>ctrl+a send_text all \x01

# Reload config
# map ctrl+a>shift+r load_config_file
# map ctrl+a>shift+e edit_config_file

# macOS convenience
map cmd+t new_tab
map cmd+w close_window
map cmd+n new_os_window
map cmd+shift+c copy_to_clipboard
map cmd+shift+v paste_from_clipboard
map cmd+equal change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0 change_font_size all 0
