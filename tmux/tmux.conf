# -- general
setw -g xterm-keys on
set -s escape-time 0
set -sg repeat-time 300
set -g mouse on
set -g default-shell /bin/zsh
set -g history-limit 50000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# -- true color
set -g default-terminal "tmux-256color"
set -as terminal-features ",*256col*:RGB"
set -as terminal-overrides ",*256col*:Tc"

# -- prefix (Ctrl-a)
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"


# -- theme
set -g @theme_color "#afd7ff"
run-shell "/opt/homebrew/bin/tmux setenv -g TMUX_THEME_COLOR '#afd7ff'"

# -- status bar
set -g status-style bg=black,fg=white
set -g status-justify 'left'
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 30
setw -g window-status-separator ''

# session tabs (left)
set-option -g status-left "#(bash ~/.tmux/tmux-status/left.sh #{q:session_id} #{q:session_name} #{q:client_width} #{q:status-bg})   "

# window tabs (center)
setw -g window-status-format '#[fg=#c5c8c6] #I #W '
setw -g window-status-current-format '#[fg=#{@theme_color},bold] #I #W '

# right
set-option -g status-right "#(bash ~/.tmux/tmux-status/right.sh)"

# -- keybindings
# -- pane split
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# -- pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -- pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# -- window navigation
bind -r C-h previous-window
bind -r C-l next-window

# -- new window with current path
bind c new-window -c "#{pane_current_path}"

# -- close pane / window
bind x kill-pane
bind X kill-window

# -- new session with name prompt
bind N command-prompt -p "New session name:" "new-session -s '%%'"

# -- zoom pane (fullscreen)
bind z resize-pane -Z

# -- vi mode
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
